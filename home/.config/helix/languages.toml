# Only languages whose server is in global/config.toml are configured here: a
# language entry that names a binary nobody installs looks broken in the editor
# and hides the real problem. Helix's built-in language definitions cover every
# other file type without a custom entry.
[[language]]
name = "python"
auto-format = true
language-servers = ["ruff", "basedpyright"]

[[language]]
name = "json"
auto-format = false

[[language]]
name = "yaml"
auto-format = false

# oxide first: Helix takes each feature from the first server offering it, and
# oxide's backlinks, tags, and daily notes beat marksman's.
[[language]]
name = "markdown"
auto-format = false
language-servers = ["markdown-oxide", "marksman"]

[[language]]
name = "toml"
auto-format = true
language-servers = ["taplo"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.taplo]
command = "taplo"
args = ["lsp", "stdio"]

[language-server.marksman]
command = "marksman"

[language-server.markdown-oxide]
command = "markdown-oxide"

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]
