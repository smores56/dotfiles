# gh-dash config for the sdlc registry. Launch it with `gh sdlc`.
#
# gh-dash prepends is:issue and sort:updated to every section filter, so these
# add only the registry, state, and label qualifiers.
defaults:
  view: issues
  issuesLimit: 50
  preview:
    open: true
  refetchIntervalMinutes: 5

# `s` switches to gh-dash's PR view, where PR keys (v approve, x close) are
# live. Keep it empty: the registry is issues-only.
prSections: []

issuesSections:
  - title: Features
    filters: repo:smores56/sdlc is:open label:type:feature
  - title: In progress
    filters: repo:smores56/sdlc is:open label:type:feature label:status:in-progress
  - title: Unapproved
    filters: repo:smores56/sdlc is:open label:type:feature -label:status:approved
  - title: Re-approval
    filters: repo:smores56/sdlc is:open label:type:feature label:status:needs-reapproval
  - title: Tasks
    filters: repo:smores56/sdlc is:open -label:type:feature label:status:todo,status:in-progress
  - title: Closed
    filters: repo:smores56/sdlc is:closed

# The fixed keymap. Each command carries the row's repo so the wrapper can
# refuse a row from anywhere else; the wrapper also preserves the action's
# exit code and waits for Enter.
keybindings:
  issues:
    - key: S
      name: sdlc status
      command: gh sdlc act status {{.IssueNumber}} {{.RepoName}}
    - key: N
      name: next ready task
      command: gh sdlc act next {{.IssueNumber}} {{.RepoName}}
    - key: v
      name: sdlc review
      command: gh sdlc act review {{.IssueNumber}} {{.RepoName}}
    - key: V
      name: approve design
      command: gh sdlc act approve {{.IssueNumber}} {{.RepoName}}
    - key: x
      name: cancel feature
      command: gh sdlc act cancel {{.IssueNumber}} {{.RepoName}}
    - key: D
      name: complete feature
      command: gh sdlc act complete {{.IssueNumber}} {{.RepoName}}
    - key: T
      name: start task
      command: gh sdlc act start {{.IssueNumber}} {{.RepoName}}
    - key: d
      name: finish task
      command: gh sdlc act finish {{.IssueNumber}} {{.RepoName}}
    - key: ctrl+x
      name: abandon task
      command: gh sdlc act abandon {{.IssueNumber}} {{.RepoName}}
