[metadata]
name = "worktrees"
description = "Worktrees of the current repository (bare gitdir plus siblings)"
requirements = ["git"]

[source]
command = '''git worktree list --porcelain | awk 'BEGIN{FS=OFS="\t"} /^worktree /{if(p!=""&&!bare){n=p; sub(/.*\//,"",n); print n,p} p=substr($0,10); bare=0; next} /^bare$/{bare=1; next} END{if(p!=""&&!bare){n=p; sub(/.*\//,"",n); print n,p}}' '''
display = "{split:\t:0}"
output = "{split:\t:1}"

[preview]
command = "git -C '{split:\t:1}' log --oneline --decorate --graph -20 --color=always"
