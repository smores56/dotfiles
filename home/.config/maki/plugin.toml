# The tool.*.input guard in init.lua sees every tool call, and maki requires the
# broad set for a layer on tools that declare no permission.
[permissions]
fs_read = true
fs_write = true
net = true
# The sushi-title slugger opens a background subagent per chat session.
agent = true
# The guard makes no network calls; the empty list keeps the layer's price
# without granting egress.
net_hosts = []
run = true
env = true
session_read = true
session_write = true
session_settings = true
