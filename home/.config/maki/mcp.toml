# TinyFish search over MCP. The bearer key is TINYFISH_API_KEY, which the zsh
# `maki` launcher passes from ~/.config/secrets.env; an unset key fails this
# server by name. The init.lua guard allows only its `search` tool.
[mcp.tinyfish]
url = "https://agent.tinyfish.ai/mcp"
headers = { Authorization = "Bearer ${TINYFISH_API_KEY}" }
