# Included by ~/.ssh/config on every machine that reaches smortress.
#
# smortress listens on the tailnet and MagicDNS names it, so ssh's own transport
# is the whole route. The key is one ed25519 file that scripts/secrets.sh
# decrypts out of dotfiles' sops.yaml; revoking a laptop happens at the tailnet.
Host smortress
    HostName smortress
    User smores
    IdentityFile ~/.ssh/id_smortress
    IdentitiesOnly yes
    StrictHostKeyChecking accept-new
# The Cloudflare tunnel route, retired at the cutover. It keeps working until
# then: the wrapper supplies the Access service token, and the file key
# (id_smortress-access) covers a lost token. The block goes with smortress-ssh.
Host ssh.sammohr.dev
    HostName ssh.sammohr.dev
    User smores
    IdentityFile ~/.ssh/id_smortress
    IdentityFile ~/.ssh/id_smortress-access
    IdentitiesOnly yes
    # %d is not a ProxyCommand token and ssh aborts on an unknown one, so the
    # wrapper path goes through $HOME.
    ProxyCommand $HOME/.local/bin/smortress-ssh %h
    StrictHostKeyChecking accept-new
