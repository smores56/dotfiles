# Included by ~/.ssh/config on every machine that reaches smortress.
#
# Access is the only route: sshd listens on loopback behind the Cloudflare
# tunnel, and the wrapper supplies the Access service token. Cloudflare checks
# the token and sshd the key, so neither half authenticates on its own.
#
# The wrapper path uses $HOME because %d is not a ProxyCommand token, and ssh
# aborts on an unknown token.
Host smortress ssh.sammohr.dev
    HostName ssh.sammohr.dev
    User smores
    # Each key completes a pair with the Access token, so neither may go: the
    # YubiKey-resident handle (id_smortress) keeps a file key from being enough
    # on its own, and the file key (id_smortress-access) covers a lost token.
    IdentityFile ~/.ssh/id_smortress
    IdentityFile ~/.ssh/id_smortress-access
    IdentitiesOnly yes
    ProxyCommand $HOME/.local/bin/smortress-ssh %h
    StrictHostKeyChecking accept-new
