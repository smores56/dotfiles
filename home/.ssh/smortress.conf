# Included by ~/.ssh/config on every machine that reaches smortress.
#
# smortress listens on the tailnet and MagicDNS names it, so ssh's own transport
# is the whole route. The key is one ed25519 file that scripts/secrets.sh
# decrypts out of dotfiles' sops.yaml; revoking a laptop happens at the tailnet.
Host smortress
    HostName smortress
    User smores
    IdentityFile ~/.ssh/id_smortress
    IdentitiesOnly yes
    # sudo's touch factor is a signature from this machine's agent: sshd forwards
    # the socket and libpam_rssh asks it for a signature, so the tap happens at
    # the key already in the laptop (design #767). Scoped to this host, never
    # `Host *` -- the forwarded socket is a signature oracle that any process
    # running as the login user on the far end can drive.
    ForwardAgent yes
    # Agent forwarding cannot be added to a session that joined an existing
    # ControlMaster, and the sudo tap needs a live forwarded socket. A
    # multiplexed session fails silently: pam_rssh finds no usable socket and
    # sudo just asks for the password. So this host never multiplexes.
    ControlMaster no
    StrictHostKeyChecking accept-new
# The Cloudflare tunnel route, retired at the cutover. It keeps working until
# then: the wrapper supplies the Access service token. The block goes with
# smortress-ssh.
Host ssh.sammohr.dev
    HostName ssh.sammohr.dev
    User smores
    IdentityFile ~/.ssh/id_smortress
    IdentitiesOnly yes
    # %d is not a ProxyCommand token and ssh aborts on an unknown one, so the
    # wrapper path goes through $HOME.
    ProxyCommand $HOME/.local/bin/smortress-ssh %h
    # Same reason as the tailnet block above: it keeps the sudo tap working on
    # this route through the cutover, and it goes when the block does.
    ForwardAgent yes
    ControlMaster no
    StrictHostKeyChecking accept-new
