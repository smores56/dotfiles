# Managed file: ~/.ssh/smortress.conf, linked from this checkout by mise and
# included by ~/.ssh/config on every machine that reaches smortress. There is
# one copy, so the personal and the work route cannot drift apart.
#
# Access is the only route: sshd listens on loopback behind smortress's
# Cloudflare tunnel, and the wrapper supplies the Access service token from its
# mode-600 file. Cloudflare verifies the service token and sshd verifies the
# key, so neither half authenticates anything on its own.
#
# The wrapper path is written with $HOME, not %d: ProxyCommand is expanded from
# a token list that does not include %d, and ssh aborts the whole connection on
# an unknown token rather than passing it through. $HOME works because the
# command is run by the user's shell.
Host smortress ssh.sammohr.dev
    HostName ssh.sammohr.dev
    User smores
    # Both keys are offered, and `IdentitiesOnly yes` keeps the offer to these
    # two. `id_smortress` is the resident `sk-ssh-ed25519` handle that only the
    # YubiKey can sign with, and `id_smortress-access` is the copyable file key
    # that covers a lost or a left-at-home token. They complete two different
    # pairs with the Access token in the wrapper, so neither line may be
    # dropped: without the handle the token reaches a shell through a file key
    # alone, and without the file key a lost token closes the route.
    IdentityFile ~/.ssh/id_smortress
    IdentityFile ~/.ssh/id_smortress-access
    IdentitiesOnly yes
    ProxyCommand $HOME/.local/bin/smortress-ssh %h
    StrictHostKeyChecking accept-new
