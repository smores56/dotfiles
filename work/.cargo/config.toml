[build]
rustc = "~/.rustup/toolchains/stable-aarch64-apple-darwin/bin/rustc"
rustdoc = "~/.rustup/toolchains/stable-aarch64-apple-darwin/bin/rustdoc"

[target.aarch64-apple-darwin]
rustflags = ["-C", "linker=/usr/bin/clang"]

# [env] reaches cargo whatever shell started it; force makes the `cc` crate
# always use Apple clang.
[env]
CC = { value = "/usr/bin/clang", force = true }
CXX = { value = "/usr/bin/clang++", force = true }
