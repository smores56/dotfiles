# CLI tools for every machine, resolved only from mise.lock (`locked = true`).
#
# Bump one tool at a time: edit the pin, then
#   mise lock --global --platform linux-x64,linux-arm64,macos-arm64
# once per environment set (plain, then MISE_ENV=desktop), use it for a day,
# and commit the config and lockfiles together.
#
# git is not listed: mise has no portable git backend, and the host's git is
# what bootstraps mise. Project-only tools (kubeconform, actionlint, yamllint,
# deno) belong in the repositories that use them.
[settings]
locked = true
# The conda backend that provides zsh on Linux is experimental.
experimental = true

[tools]
# The Fedora images ship no zsh. bootstrap-task.sh links the real binary to
# ~/.local/bin/zsh, never mise's launcher, which leaks CONDA_* into children.
"conda:zsh" = { version = "5.9.2", os = ["linux"] }
# python runs the maki-session-search helper.
python = "3.14.10"
gh = "2.104.0"
jq = "1.8.2"
yq = "4.54.3"
ripgrep = "15.2.0"
fd = "10.5.2"
bat = "0.26.1"
eza = "0.23.5"
just = "1.59.0"
uv = "0.13.8"
shellcheck = "0.11.0"
"aqua:junegunn/fzf" = "0.75.0"
"aqua:atuinsh/atuin" = "18.24.8"
"aqua:helix-editor/helix" = "25.07.1"
"aqua:jesseduffield/lazygit" = "0.66.3"
"aqua:zellij-org/zellij" = "0.46.0"
"aqua:sxyazi/yazi" = "26.9.1"
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"aqua:alexpasmantier/television" = "0.15.9"
"aqua:dandavison/delta" = "0.20.1"
# sops decrypts the repos' secret files; age unwraps the passphrase-protected
# identity through ~/.local/bin/sops-age-key.
"aqua:getsops/sops" = "3.13.3"
"aqua:FiloSottile/age" = "1.3.2"
# The FIDO2 hmac-secret plugin gives sops a YubiKey identity beside the admin
# key (see .sops.yaml). Upstream publishes no linux-arm64 binary, so the pin
# names the platforms that exist; mise skips the rest and `platforms` is what
# the lockfile coverage check reads.
"github:olastor/age-plugin-fido2-hmac" = { version = "0.5.0", platforms = ["linux-x64", "macos-arm64"] }
# Helix language servers and formatters. npm-based servers are left out: they
# would need a mise node, which shadows the employer's nvm node on smoreswork;
# mdformat is left out because its plugins cannot be dependency-locked.
# pipx tools lock by version only (PyPI hashes them); the rest lock checksums.
"aqua:astral-sh/ruff" = "0.17.5"
"github:Feel-ix-343/markdown-oxide" = "0.25.12"
"github:Automattic/harper" = { version = "3.2.0", bin = "harper-ls" }
"github:LuaLS/lua-language-server" = "3.19.2"
"pipx:basedpyright" = "1.40.2"
# The terminal diff reviewer.
"github:umputun/revdiff" = "1.15.0"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:artempyanykh/marksman" = "2026-02-08"
