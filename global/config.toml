# CLI tools for every machine. Bump one at a time, then once per environment
# set (plain, then MISE_ENV=desktop):
#   mise lock --global --platform linux-x64,linux-arm64,macos-arm64
# git is the host's: it bootstraps mise.
[settings]
locked = true
experimental = true

[tools]
# tofu/opentofu for homelab-platform and the Cloudflare state.
opentofu = "1.13.9"
# butane renders homelab-platform's ignition; scripts/render-ignition.sh pins 0.29.x.
"aqua:coreos/butane" = "0.29.0"
python = "3.14.10"
gh = "2.104.0"
jq = "1.8.2"
yq = "4.54.3"
ripgrep = "15.2.0"
fd = "10.5.2"
bat = "0.26.1"
# vfox, not aqua: aqua has no darwin asset and would need cargo on the work Mac.
eza = "0.23.5"
just = "1.59.0"
uv = "0.13.8"
shellcheck = "0.11.0"
# The homelab-platform gate runs both; yamllint is pipx like basedpyright.
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:fish-shell/fish-shell" = "4.9.3"
"github:Gobidev/pfetch-rs" = "3.1.1"
"aqua:junegunn/fzf" = "0.75.0"
"aqua:helix-editor/helix" = "25.07.1"
"aqua:jesseduffield/lazygit" = "0.66.3"
"aqua:zellij-org/zellij" = "0.46.0"
"aqua:sxyazi/yazi" = "26.9.1"
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"aqua:dandavison/delta" = "0.20.1"
"aqua:getsops/sops" = "3.13.3"
"aqua:FiloSottile/age" = "1.3.2"
# Upstream publishes no linux-arm64 binary; the lockfile check reads `platforms`.
"github:olastor/age-plugin-fido2-hmac" = { version = "0.5.0", platforms = ["linux-x64", "macos-arm64"] }
# Helix language servers. No npm servers: a mise node would shadow the work
# Mac's nvm node. No mdformat: its plugins cannot be dependency-locked.
"aqua:astral-sh/ruff" = "0.17.5"
"github:Feel-ix-343/markdown-oxide" = "0.25.12"
"github:Automattic/harper" = { version = "3.2.0", bin = "harper-ls" }
"github:LuaLS/lua-language-server" = "3.19.2"
"pipx:yamllint" = "1.38.0"
"pipx:basedpyright" = "1.40.2"
"github:umputun/revdiff" = "1.15.0"
"github:agynio/gh-pr-review" = { version = "1.6.2", bin = "gh-pr-review" }
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:artempyanykh/marksman" = "2026-02-08"
