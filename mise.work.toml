# smoreswork only.

# The work Mac is the one client without a system tailscaled: it runs an
# unprivileged, userspace one, built from source because upstream's macOS asset
# is a GUI app bundle with no tailscaled in it. The go backend builds with the
# pinned toolchain, which mise installs first.
[tools]
go = "1.27.4"
"go:tailscale.com/cmd/tailscale" = "1.104.7"
"go:tailscale.com/cmd/tailscaled" = "1.104.7"

[dotfiles]
"~/.config/shell/env.d/work.sh" = { source = "work/.config/shell/env.d/work.sh" }
"~/.config/fish/conf.d/90-work.fish" = { source = "work/.config/fish/conf.d/90-work.fish" }
"~/.claude/work.md" = { source = "work/.claude/work.md" }
"~/.config/git/config" = { source = "identity/.config/git/config" }
"~/.ssh/config" = { source = "work/.ssh/config" }
"~/.ssh/smortress.conf" = { source = "home/.ssh/smortress.conf" }
"~/Library/LaunchAgents/dev.sammohr.tailscaled.plist" = { source = "work/.config/LaunchAgents/dev.sammohr.tailscaled.plist" }
"~/Library/LaunchAgents/dev.sammohr.ssh-agent.plist" = { source = "work/.config/LaunchAgents/dev.sammohr.ssh-agent.plist" }
"~/.config/git/machine.inc" = { source = "work/.config/git/machine.inc.tera", mode = "template" }
"~/.cargo/config.toml" = { source = "work/.cargo/config.toml" }

# chsh prompts for the password: `mise bootstrap --only user`.
[bootstrap.user]
login_shell = "/bin/zsh"

# mise refuses the group-writable /Applications. AeroSpace's tap needs Ruby 3
# to evaluate, so it is by hand: brew install --cask nikitabobko/tap/aerospace
[bootstrap.packages]
# smortress-ssh's transport; Linux pins it in global/config.desktop.toml.
"brew:cloudflared" = "latest"
"brew-cask:brave-browser" = { version = "latest", appdir = "~/Applications" }
"brew-cask:docker-desktop" = { version = "latest", appdir = "~/Applications" }
"brew-cask:caffeine" = { version = "latest", appdir = "~/Applications" }
"brew-cask:gitify" = { version = "latest", appdir = "~/Applications" }
"brew-cask:steam" = { version = "latest", appdir = "~/Applications" }
"brew-cask:nvidia-geforce-now" = { version = "latest", appdir = "~/Applications" }

# AeroSpace binds Ctrl with the arrows and digits, so macOS's Mission Control
# and Spaces shortcuts on those chords are turned off; the screenshot shortcuts
# move to Ctrl+Shift+Cmd+3/4/5.
[bootstrap.settings.macos]
defaults_entries = [
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["32", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["33", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["34", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["35", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["79", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["80", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["81", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["82", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["118", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["119", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["120", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["121", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["122", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["123", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["124", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["125", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["126", "enabled"], value = false },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["28"], value = { enabled = true, value = { parameters = [65535, 105, 8388608], type = "standard" } } },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["30"], value = { enabled = true, value = { parameters = [65535, 105, 8650752], type = "standard" } } },
  { domain = "com.apple.symbolichotkeys", key = "AppleSymbolicHotKeys", path = ["184"], value = { enabled = true, value = { parameters = [65535, 105, 8912896], type = "standard" } } },
]

[bootstrap.settings.macos.keyboard]
key_repeat = 2
initial_key_repeat = 13

[bootstrap.settings.macos.defaults.NSGlobalDomain]
"com.apple.swipescrolldirection" = false
"com.apple.scrollwheel.scaling" = 0.5

# The session caches shortcuts; without a reload they wait for the next login.
[bootstrap.hooks.post-defaults]
description = "reload the keyboard shortcuts"
run = "/System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u || true"
