# smoreswork only: living beside home-manager while pieces move over. Each
# piece is handed over by scripts/handoff.sh after nix-config stops writing it.
[dotfiles]
"~/.config/zsh/env.d/work.zsh" = { source = "work/.config/zsh/env.d/work.zsh" }
"~/.config/zsh/conf.d/90-work.zsh" = { source = "work/.config/zsh/conf.d/90-work.zsh" }
"~/.claude/work.md" = { source = "work/.claude/work.md" }
"~/.gitconfig" = { source = "identity/.gitconfig" }
"~/.ssh/config" = { source = "work/.ssh/config" }
"~/.config/git/machine.inc" = { source = "work/.config/git/machine.inc.tera", mode = "template" }
"~/.config/ssh/allowed_signers" = { source = "work/.config/ssh/allowed_signers.tera", mode = "template" }

# macOS ships zsh 5.9 in /etc/shells already, so no sudo; chsh asks for the
# password, so this part runs on its own: `mise bootstrap --only user`.
[bootstrap.user]
login_shell = "/bin/zsh"

# Work identity. Answers live in $MISE_STATE_DIR/vars.toml; the signing key is
# the public half of the SSH key 1Password holds (copy it from the 1Password
# item), so nothing secret is ever a var.
[vars.git_name]
prompt = "Git author name"
required = "Run `mise vars prompt git_name`"
[vars.work_email]
prompt = "Work Git email"
required = "Run `mise vars prompt work_email`"
[vars.work_signing_pubkey]
prompt = "Public key of the 1Password SSH key (ssh-ed25519 AAAA...)"
required = "Run `mise vars prompt work_signing_pubkey`"

[bootstrap.hooks.pre-dotfiles]
description = "check the work identity vars"
run = "sh {{ config_root }}/scripts/identity.sh check-work {{ vars.git_name | quote }} {{ vars.work_email | quote }} {{ vars.work_signing_pubkey | quote }}"
