# smoreswork only: living beside home-manager while pieces move over. Each
# piece is handed over by scripts/handoff.sh after nix-config stops writing it.
[dotfiles]
"~/.config/zsh/env.d/work.zsh" = { source = "work/.config/zsh/env.d/work.zsh" }
"~/.config/zsh/conf.d/90-work.zsh" = { source = "work/.config/zsh/conf.d/90-work.zsh" }
"~/.claude/work.md" = { source = "work/.claude/work.md" }
"~/.gitconfig" = { source = "identity/.gitconfig" }
"~/.ssh/config" = { source = "work/.ssh/config" }
"~/.config/git/machine.inc" = { source = "work/.config/git/machine.inc.tera", mode = "template" }
"~/.config/git/work-signing.pub" = { source = "work/.config/git/work-signing.pub" }
"~/.config/gh-token-ref" = { source = "work/.config/gh-token-ref.tera", mode = "template" }
"~/.local/bin/gh" = { source = "work/.local/bin/gh" }
"~/.cargo/config.toml" = { source = "work/.cargo/config.toml" }

# macOS ships zsh 5.9 in /etc/shells already, so no sudo; chsh asks for the
# password, so this part runs on its own: `mise bootstrap --only user`.
[bootstrap.user]
login_shell = "/bin/zsh"

# Work identity is fixed in the templates and the checked-in public key.
[bootstrap.hooks.post-dotfiles]
description = "render allowed_signers"
run = "sh {{ config_root }}/scripts/identity.sh work-signers"

# Apps for a fresh laptop. ~/Applications: mise refuses a group-writable
# /Applications. Copies already installed elsewhere stay where they are.
# AeroSpace comes from a tap that mise can only evaluate with Ruby 3, so it
# is installed by hand: brew install --cask nikitabobko/tap/aerospace
[bootstrap.packages]
"brew:gh" = "latest"
# The op CLI reads the work token and signs through the app's SSH agent; the
# 1Password app itself is provided by the employer, not installed here.
"brew-cask:1password-cli" = "latest"
"brew-cask:brave-browser" = { version = "latest", appdir = "~/Applications" }
"brew-cask:docker-desktop" = { version = "latest", appdir = "~/Applications" }
"brew-cask:caffeine" = { version = "latest", appdir = "~/Applications" }
"brew-cask:gitify" = { version = "latest", appdir = "~/Applications" }
"brew-cask:steam" = { version = "latest", appdir = "~/Applications" }
"brew-cask:nvidia-geforce-now" = { version = "latest", appdir = "~/Applications" }

[bootstrap.settings.macos.keyboard]
key_repeat = 2
initial_key_repeat = 13

[bootstrap.settings.macos.defaults.NSGlobalDomain]
"com.apple.swipescrolldirection" = false
"com.apple.scrollwheel.scaling" = 0.5

# AeroSpace binds Ctrl with the arrows and digits, so macOS's own Mission Control
# and Spaces shortcuts on those chords are turned off; the screenshot shortcuts
# move to Ctrl+Shift+Cmd+3/4/5. Each entry changes one shortcut and keeps the rest.
[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["32", "enabled"]
value = false

