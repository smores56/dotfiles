# Machines with a display. Linux-only pieces use an `os` variant so the macOS
# laptop skips them.
[dotfiles]
"~/.aerospace.toml" = { source = "desktop/.aerospace.toml", variants = [{ os = "macos" }] }
"~/.local/bin/wallpapers" = { source = "desktop/.local/bin/wallpapers", variants = [{ os = "linux" }] }
"~/.local/bin/tty" = { source = "desktop/.local/bin/tty", variants = [{ os = "linux" }] }
"~/.config/systemd/user" = { source = "desktop/.config/systemd/user", mode = "symlink-each", variants = [{ os = "linux" }] }
"~/.config/wezterm" = { source = "desktop/.config/wezterm", mode = "symlink-each" }
# Copies, not links: macOS does not reliably register a symlinked font.
# Google Sans Code v7.001 from the upstream release (googlefonts/googlesans-code,
# GoogleSansCode-v7.001.zip sha256 eebba2a438882396e8530cad6d6cb80182b0afb6e9e0ad07b7340359a53ba2e9),
# with its MONO axis; renamed because mise reads "[MONO,wght]" as a glob.
"~/Library/Fonts/GoogleSansCode-MONO-VF.ttf" = { source = "desktop/fonts/GoogleSansCode-MONO-VF.ttf", mode = "copy", variants = [{ os = "macos" }] }
"~/Library/Fonts/GoogleSansCode-Italic-MONO-VF.ttf" = { source = "desktop/fonts/GoogleSansCode-Italic-MONO-VF.ttf", mode = "copy", variants = [{ os = "macos" }] }

[bootstrap.packages]
# ~/Applications: mise refuses to install through a group-writable
# /Applications (root:admin 0775 on the work laptop), and it needs no sudo.
"brew-cask:wezterm" = { version = "latest", os = ["macos"], appdir = "~/Applications" }
