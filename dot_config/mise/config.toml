# User-level CLI versions for every machine.
#
# Every pin below is deliberate: bump one tool at a time, run `mise install`,
# use it for a day, then commit. Never "update all" in one pass — a broken
# tool should be attributable to exactly one changed line.
#
# git is not listed because mise has no git backend (git ships no portable
# binaries) and the OS git is what bootstraps mise. Pin git with rpm-ostree on
# Fedora Atomic and with Homebrew on macOS instead.
[tools]
gh = "2.104.0"
jq = "1.8.2"
yq = "4.54.3"
ripgrep = "15.2.0"
fd = "10.5.2"
bat = "0.26.1"
eza = "0.23.5"
just = "1.59.0"
uv = "0.13.8"
deno = "2.9.8"
shellcheck = "0.11.0"
yamllint = "1.38.0"
kubeconform = "0.8.0"
actionlint = "1.7.12"
# Not packaged for Fedora, so mise installs their pinned prebuilt releases on
# every machine; helix and lazygit come from the package manager instead.
"aqua:zellij-org/zellij" = "0.46.0"
"aqua:sxyazi/yazi" = "26.9.1"

[settings]
# Tools come from precompiled releases; nothing here compiles from source.
always_keep_download = false
