[[language]]
name = "rust"

[[language]]
name = "java"
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "tsx"
auto-format = true
roots = ["package.json"]

[[language]]
name = "javascript"
auto-format = true
roots = ["package.json"]
file-types = ["js", "jsx"]

[[language]]
name = "typescript"
auto-format = true
roots = ["package.json"]
file-types = ["ts", "tsx"]

[[language]]
name = "svelte"
auto-format = true
roots = ["package.json"]

[[language]]
name = "python"
auto-format = true
language-servers = ["ruff"]

[[language]]
name = "json"
auto-format = false

[[language]]
name = "yaml"
auto-format = false

[[language]]
name = "markdown"
auto-format = false
language-servers = ["marksman"]

[[language]]
name = "toml"
auto-format = true
language-servers = ["taplo"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.taplo]
command = "taplo"
args = ["lsp", "stdio"]

[language-server.marksman]
command = "marksman"

[language-server.rust-analyzer.config.rust-analyzer.diagnostics]
disabled = ["unresolved-proc-macro"]
