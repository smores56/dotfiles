name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install checks
        run: |
          sudo apt-get update
          sudo apt-get install -y bash fish git python3 shellcheck
      - name: Run the checks
        run: tests/check.sh --shellcheck
