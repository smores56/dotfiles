name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash git libnotify-bin python3 shellcheck zsh
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install: false
      - name: Run the checks
        run: tests/check.sh --shellcheck

  # Every pinned tool must install from the lockfiles on each platform a
  # machine runs.
  locked:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          - os: ubuntu-24.04-arm
            sha256: b8dd05af6447cee933928664982a8cb2fa646e6951cfc8539db23ce2554a7b04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: ${{ matrix.sha256 }}
          install: false
      - name: Stage the global config the way bootstrap links it
        run: |
          mkdir -p "$HOME/.config/mise"
          cp -a global/. "$HOME/.config/mise/"
      - name: Install the locked global tools
        env:
          MISE_ENV: desktop
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: mise install --locked

  apply-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          sha256: f13f3e5ec88807e0161669b3aa07a91d84478cdf1e95b5b92b63f85a25d42395
          install: false
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Apply into a throwaway HOME on Fedora
        run: |
          podman run --rm \
            -e HOME=/root -e TERM=dumb \
            -v "$PWD:/src:ro" \
            -v "$(command -v mise):/usr/local/bin/mise:ro" \
            -w /src fedora:43 \
            sh -euxc 'dnf install -y git >/dev/null
                      sh tests/apply-lane.sh desktop,identity /usr/local/bin/mise'
