# CLI tool versions for every machine. install.sh links this file to
# ~/.config/mise/config.toml, and `mise install` materialises them.
#
# Every pin is deliberate: bump one tool at a time, run `mise install`, use it
# for a day, then commit. Never "update all" in one pass — a broken tool should
# be attributable to exactly one changed line.
#
# git is not listed because mise has no portable git backend; the host image's
# git is what bootstraps mise. fish boots from mise here, so its release pin is
# what the interactive shell runs. The shell itself stays the host's for the
# first login (see docs/manual-steps.md for the optional chsh).
[tools]
"aqua:fish-shell/fish-shell" = "4.9.3"
# python runs the maki-session-search helper; the pinned standalone build keeps
# it off the host image.
python = "3.14.10"
gh = "2.104.0"
jq = "1.8.2"
yq = "4.54.3"
ripgrep = "15.2.0"
fd = "10.5.2"
bat = "0.26.1"
eza = "0.23.5"
just = "1.59.0"
uv = "0.13.8"
deno = "2.9.8"
shellcheck = "0.11.0"
yamllint = "1.38.0"
kubeconform = "0.8.0"
actionlint = "1.7.12"
"aqua:helix-editor/helix" = "25.07.1"
"aqua:jesseduffield/lazygit" = "0.66.3"
"aqua:zellij-org/zellij" = "0.46.0"
"aqua:sxyazi/yazi" = "26.9.1"
"aqua:ajeetdsouza/zoxide" = "0.10.0"
"aqua:alexpasmantier/television" = "0.15.9"
"aqua:dandavison/delta" = "0.20.1"
# Homelab secrets: sops decrypts the repos' secret files, age unwraps the
# passphrase-protected identity through ~/.local/bin/sops-age-key.
"aqua:getsops/sops" = "3.13.3"
"aqua:FiloSottile/age" = "1.3.2"
# Helix language servers and formatters; small single binaries.
"aqua:astral-sh/ruff" = "0.17.5"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:artempyanykh/marksman" = "2026-02-08"

[settings]
# Tools come from precompiled releases; nothing here compiles from source.
always_keep_download = false
