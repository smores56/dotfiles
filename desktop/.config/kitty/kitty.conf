# kitty, the Linux terminal. The macOS work laptop keeps WezTerm.
#
# Colors are the Rose Pine Moon palette, matching Noctalia's community palette.
# The terminal has no ligature config: Google Sans Code ships none.

# kitty starts a non-login shell, so the ~/.bash_profile hand-off never fires
# here. Use the real mise zsh binary, not mise's launcher, which leaks CONDA_*
# into children.
shell ${HOME}/.local/bin/zsh

font_family family='Google Sans Code' style=Regular
bold_font family='Google Sans Code' style=Bold
italic_font family='Google Sans Code' style=Italic
bold_italic_font family='Google Sans Code' style='Bold Italic'
font_size 12

background_opacity 0.95
hide_window_decorations yes
tab_bar_min_tabs 2
enable_audio_bell no
visual_bell_duration 0.15
wayland_enable_ime yes

foreground            #e0def4
background            #232136
selection_foreground  #e0def4
selection_background  #44415a
cursor                #e0def4
cursor_text_color     #232136
url_color             #c4a7e7

color0  #393552
color8  #6e6a86
color1  #eb6f92
color9  #eb6f92
color2  #3e8fb0
color10 #3e8fb0
color3  #f6c177
color11 #f6c177
color4  #9ccfd8
color12 #9ccfd8
color5  #c4a7e7
color13 #c4a7e7
color6  #ea9a97
color14 #ea9a97
