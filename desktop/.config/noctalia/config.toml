# polkit_agent: the lock screen reaches fprintd over D-Bus, so the only elevated
# step is enrollment (`fprintd-enroll` is auth_self); without this agent polkit
# has nothing to prompt with and the daemon answers Not Authorized.
[shell]
telemetry_enabled = false
polkit_agent = true
clipboard_enabled = true
clipboard_auto_paste = "auto"
time_format = "{:%-I:%M %p}"
font_family = "Google Sans Code"
avatar_path = "~/.config/noctalia/avatar.png"

[theme]
mode = "dark"
source = "community"
community_palette = "Rose Pine Moon"

[location]
auto_locate = true

[bar.main]
position = "top"
margin_ends = 0
start = ["launcher", "clock", "sysmon", "active_window", "media"]
center = ["workspaces"]
end = ["tray", "notifications", "battery", "volume", "brightness", "control-center"]

[widget.workspaces]
hide_when_empty = true

[widget.clock]
format = "{:%-I:%M %p %a, %b %d}"
vertical_format = "{:%-I:%M %p}"
tooltip_format = "{:%-I:%M %p %a, %b %d}"

[wallpaper]
enabled = true
fill_color = "#232136"
automation.enabled = false

[weather]
enabled = true
unit = "fahrenheit"

[audio]
enable_overdrive = true
enable_sounds = true

[nightlight]
enabled = true

[dock]
enabled = false

[lockscreen]
enabled = true
lock_before_suspend = true
fingerprint = true
blur_intensity = 0.4
tint_intensity = 0.4

[shell.launcher.providers.session]
global = true

[idle]
behavior_order = ["lock", "screen-off", "suspend"]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

[idle.behavior.suspend]
timeout = 900
action = "lock_and_suspend"
enabled = true
