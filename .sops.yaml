# Cross-machine secrets, encrypted to the passphrase-wrapped admin age identity
# and to each of the three YubiKeys. A touch-only handle is a bearer grant: with
# a token attached, the handle file derives that key for as long as an attacker
# keeps it. The rule lists &admin first so a no-token decrypt prompts once.
# Homelab secrets stay in homelab-platform.
keys:
  - &admin age1skuwunreduvw8gtkzyf9atsyjnku388ly8c252h3qger84fg5d7q4kf6xs
  # `age-plugin-fido2-hmac -g` (no PIN, separate identity); one block per key in
  # ~/.config/sops/fido2-identity.txt. A reset orphans that key's recipient.
  - &yk1 age18suc3usnfah6g3fldvhhvmchyupg3tp2p5vgzfuprvcn6untva9qem4lf0
  - &yk2 age1zepedng5vqafu95hysrxl0kadreshg2yc07epfqky5fuq2nmy5fqg649lf
  - &yk3 age1xqpw0qy2mk98ptvvh5y0sxtlrxs036nng2868zd6dc4wdcrrm5mqd6pnpf
creation_rules:
  - path_regex: ^sops\.yaml$
    key_groups:
      - age:
          - *admin
          - *yk1
          - *yk2
          - *yk3
