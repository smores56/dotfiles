# Git and SSH identity for personal machines; smoreswork uses mise.work.toml.

[vars]
repos_root = "/srv/git"

[dotfiles]
"~/.config/git/config" = { source = "identity/.config/git/config" }
"~/.ssh/config" = { source = "identity/.ssh/config" }
"~/.ssh/smortress.conf" = { source = "home/.ssh/smortress.conf" }
"~/.config/fish/conf.d/85-identity.fish" = { source = "identity/.config/fish/conf.d/85-identity.fish.tera", mode = "template" }
"~/.config/git/machine.inc" = { source = "identity/.config/git/machine.inc.tera", mode = "template" }
"~/.config/git/work.inc" = { source = "identity/.config/git/work.inc.tera", mode = "template" }

# The README's second step. A bare name resolves the ~/.local/bin/mise-fish
# wrapper from PATH, which mise adds to /etc/shells and hands to chsh; a shim
# path would not be a valid shell and is per-machine.
[bootstrap.user]
login_shell = "mise-fish"
