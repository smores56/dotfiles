# Git and SSH identity for personal machines. smoreswork does not apply this
# environment; mise.work.toml renders its own work identity and SSH config.

[dotfiles]
"~/.gitconfig" = { source = "identity/.gitconfig" }
"~/.ssh/config" = { source = "identity/.ssh/config" }
# The smortress route is written once, under home/, and included by the two
# ~/.ssh/config files that need it; the base environment deploys neither.
"~/.ssh/smortress.conf" = { source = "home/.ssh/smortress.conf" }
"~/.config/zsh/conf.d/85-identity.zsh" = { source = "identity/.config/zsh/conf.d/85-identity.zsh" }
"~/.config/git/machine.inc" = { source = "identity/.config/git/machine.inc.tera", mode = "template" }
"~/.config/git/work.inc" = { source = "identity/.config/git/work.inc.tera", mode = "template" }
