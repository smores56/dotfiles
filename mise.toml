# Every host. Tools live in global/ (~/.config/mise); environments only add:
# smortress identity, smorespro desktop,identity, smoreswork desktop,work.
min_version = "2026.11.9"

# fish plugins at pinned commits, loaded by config.fish from these paths:
# pure v4.19.2, async-prompt v1.3.0, done 1.21.1.
[bootstrap.repos]
"~/.local/share/fish-plugins/pure" = { url = "https://github.com/pure-fish/pure.git", ref = "39ef70d91421322d1f90828d1838f19891f7772c" }
"~/.local/share/fish-plugins/async-prompt" = { url = "https://github.com/acomagu/fish-async-prompt.git", ref = "b90e8a8c6d1634d8f04f1532b164b99530445159" }
"~/.local/share/fish-plugins/done" = { url = "https://github.com/franciscolourenco/done.git", ref = "998ad4f5fc9cee36c09840a7e635b56428e554f9" }

[dotfiles]
"~/.zshenv" = { source = "home/.zshenv" }
"~/.config/fish" = { source = "home/.config/fish", mode = "symlink-each" }
"~/.config/shell" = { source = "home/.config/shell", mode = "symlink-each" }
# A bash login reads only ~/.bash_profile, a non-login one only ~/.bashrc.
"~/.bash_profile/shell-env" = { block = '[ -r "$HOME/.config/shell/env.sh" ] && . "$HOME/.config/shell/env.sh"' }
"~/.bashrc/shell-env" = { block = '[ -r "$HOME/.config/shell/env.sh" ] && . "$HOME/.config/shell/env.sh"' }
# macOS /etc/zprofile's path_helper reorders PATH after ~/.zshenv; a block
# because installers append their own lines here.
"~/.zprofile/shell-env" = { block = '''emulate sh -c 'f=${XDG_CONFIG_HOME:-$HOME/.config}/shell/env.sh; [ -r "$f" ] && . "$f"; unset f'''' }
"~/.config/gh" = { source = "home/.config/gh", mode = "symlink-each" }
"~/.config/git" = { source = "home/.config/git", mode = "symlink-each" }
"~/.config/helix" = { source = "home/.config/helix", mode = "symlink-each" }
# lazygit on macOS reads ~/Library/Application Support unless XDG_CONFIG_HOME is set.
"~/.config/lazygit" = { source = "home/.config/lazygit", mode = "symlink-each", variants = [
  { os = "macos", target = "~/Library/Application Support/lazygit" },
  { default = true },
] }
"~/.config/yazi" = { source = "home/.config/yazi", mode = "symlink-each" }
"~/.config/zellij" = { source = "home/.config/zellij", mode = "symlink-each" }
# Servers lack kitty's terminfo for SSH sessions from kitty.
"~/.terminfo" = { source = "home/.terminfo", mode = "symlink-each" }
"~/.local/bin" = { source = "home/.local/bin", mode = "symlink-each" }
"~/.local/bin/sdlc" = { source = "sdlc/sdlc_issues.py" }
"~/.config/maki" = { source = "home/.config/maki", mode = "symlink-each" }
"~/.agents/skills" = { source = "sdlc/skills", mode = "symlink-each" }
# Claude Code rewrites settings.json, so only the keys this repo owns merge in.
"~/.claude/CLAUDE.md" = { source = "home/.claude/CLAUDE.md" }
# Placeholder for CLAUDE.md's import; the work environment replaces it.
"~/.claude/work.md" = { source = "home/.claude/work.md" }
"~/.claude/agents/Explore.md" = { source = "home/.claude/agents/Explore.md" }
"~/.claude/skills" = { source = "sdlc/skills", mode = "symlink-each" }
"~/.claude/settings.json/shared" = { source = "home/.claude-merge/settings.json", merge = true }

# A checkout that moved leaves mise dotfile state keyed by the old source path;
# --prune-dotfiles then deletes the links the live entries own, so every other
# bootstrap undid half the dotfiles.
[bootstrap.hooks.pre-dotfiles]
description = "drop dotfile state from another checkout path"
run = '''sh scripts/prune-dotfile-state.sh'''

[tasks.bootstrap]
description = "Install the pieces mise does not manage declaratively"
run = "sh scripts/bootstrap-task.sh"
