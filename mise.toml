# Machine definition for every host. `mise bootstrap` applies it from this
# checkout; the global tool set lives in global/, which `--config-dir global`
# links to ~/.config/mise. Environments only add entries; the one exclusion,
# smoreswork's mise `gh`, lives in global/config.work.toml:
#   smortress   identity
#   smorespro   desktop,identity
#   smoreswork  desktop,work
min_version = "2026.11.9"

# zsh modules, each at a pinned commit (tags move; commits do not). zimfw
# loads them from these paths as external modules and never fetches them.
# Bump one at a time: change the ref, `mise bootstrap --only repos,task`.
[bootstrap.repos]
"~/.local/share/zsh-plugins/environment" = { url = "https://github.com/zimfw/environment.git", ref = "d4bceaa3da89cd819843334dba1a5bf7dc137e14" }
"~/.local/share/zsh-plugins/input" = { url = "https://github.com/zimfw/input.git", ref = "bdec2b372f8bd16a072d30ebc447a22dad52cfb4" }
"~/.local/share/zsh-plugins/termtitle" = { url = "https://github.com/zimfw/termtitle.git", ref = "b0de7783181804d21cc73fbb109fb89e8b021327" }
"~/.local/share/zsh-plugins/utility" = { url = "https://github.com/zimfw/utility.git", ref = "c7ed9b9da79224d820661d9b4337429764784c69" }
"~/.local/share/zsh-plugins/completion" = { url = "https://github.com/zimfw/completion.git", ref = "213d38b36475865445b0ea1a3f7779c881f132cd" }
"~/.local/share/zsh-plugins/zsh-abbr" = { url = "https://github.com/olets/zsh-abbr.git", ref = "4facba32711875fb2049720a0f6d6d5c3b56b986", submodules = true }
"~/.local/share/zsh-plugins/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab.git", ref = "d7e0234614dbe5369fdd760907d12c0e05a4dccc" }
"~/.local/share/zsh-plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", ref = "e52ee8ca55bcc56a17c828767a3f98f22a68d4eb" }
"~/.local/share/zsh-plugins/zsh-autosuggestions-abbreviations-strategy" = { url = "https://github.com/olets/zsh-autosuggestions-abbreviations-strategy.git", ref = "3ce24713e4a49f9a5060d9016d35f3cd048d1c74" }
"~/.local/share/zsh-plugins/zsh-auto-notify" = { url = "https://github.com/MichaelAquilina/zsh-auto-notify.git", ref = "3e9bce0072240b1009e5ab380365453c3b243c62" }
"~/.local/share/zsh-plugins/pure" = { url = "https://github.com/sindresorhus/pure.git", ref = "cac55d0b531a0db72294c9bba9453dfa6374c59d" }
"~/.local/share/zsh-plugins/fast-syntax-highlighting" = { url = "https://github.com/zdharma-continuum/fast-syntax-highlighting.git", ref = "5ecd353c81214f82bdeca5483fab6ccc5a2d5494" }
"~/.local/share/zsh-plugins/fast-abbr-highlighting" = { url = "https://github.com/5A6F65/fast-abbr-highlighting.git", ref = "ca6ac66b419dab40fea9a41ee27f26a7e032abe0" }

[dotfiles]
"~/.zshenv" = { source = "home/.zshenv" }
"~/.config/zsh" = { source = "home/.config/zsh", mode = "symlink-each" }
"~/.config/gh" = { source = "home/.config/gh", mode = "symlink-each" }
"~/.config/git" = { source = "home/.config/git", mode = "symlink-each" }
"~/.config/helix" = { source = "home/.config/helix", mode = "symlink-each" }
# lazygit on macOS reads ~/Library/Application Support unless XDG_CONFIG_HOME is set.
"~/.config/lazygit" = { source = "home/.config/lazygit", mode = "symlink-each", variants = [
  { os = "macos", target = "~/Library/Application Support/lazygit" },
  { default = true },
] }
"~/.config/television" = { source = "home/.config/television", mode = "symlink-each" }
"~/.config/yazi" = { source = "home/.config/yazi", mode = "symlink-each" }
"~/.config/zellij" = { source = "home/.config/zellij", mode = "symlink-each" }
# kitty's Fedora package ships xterm-kitty only in the letter layout, and the
# conda zsh's ncurses resolves only the hashed layout in a TERMINFO directory
# (zellij exports one), so an entry here is the only thing that gives zsh its
# capabilities: without it zle has no setaf, smso, or smkx. Servers have no
# kitty package at all, so the compiled entry has to come from this repository.
"~/.terminfo" = { source = "home/.terminfo", mode = "symlink-each" }
"~/.local/bin" = { source = "home/.local/bin", mode = "symlink-each" }
# The stdlib sdlc CLI; $SDLC_REPO selects the personal or work registry.
"~/.local/bin/sdlc" = { source = "sdlc/sdlc_issues.py" }
"~/.config/maki" = { source = "home/.config/maki", mode = "symlink-each" }
"~/.agents/skills" = { source = "sdlc/skills", mode = "symlink-each" }
# Claude Code: one CLAUDE.md for every machine (it imports ~/.claude/work.md,
# which only the work environment deploys), the shared skills, and only the
# settings keys this repository owns; Claude Code writes the rest itself.
"~/.claude/CLAUDE.md" = { source = "home/.claude/CLAUDE.md" }
# A placeholder, so the import always resolves; the work environment replaces it.
"~/.claude/work.md" = { source = "home/.claude/work.md" }
"~/.claude/agents/Explore.md" = { source = "home/.claude/agents/Explore.md" }
"~/.claude/skills" = { source = "sdlc/skills", mode = "symlink-each" }
"~/.claude/settings.json/shared" = { source = "home/.claude-merge/settings.json", merge = true }

# ssh writes known_hosts under ~/.config/ssh but never creates the directory.
[bootstrap.hooks.post-dotfiles]
description = "create the ssh known_hosts directory"
run = "mkdir -p -m 700 \"$HOME/.config/ssh\""

[tasks.bootstrap]
description = "Install the pieces mise does not manage declaratively"
run = "sh scripts/bootstrap-task.sh"
